<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Footy Checker — Football Fixtures &amp; Odds Predictor</title>

  <!-- Inter font with clean system-ui fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            canvas: '#F6F8FA',
            surface: '#FFFFFF',
            hairline: '#E5E9F0',
            ink: '#111827',
            secondary: '#6B7280',
            emeraldPitch: '#059669',
          },
        },
      },
    };
  </script>

  <style>
    /* Base editorial defaults & strict mobile overflow protection */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #F6F8FA;
      color: #111827;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar cleanly on horizontal quick-select club chips */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Full-screen Startup Pitch Animation Overlay (no skip button, no bottom bar) */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      height: 100vh;
      height: 100dvh;
      background-color: #0b3d24;
      background-image: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 36px,
        rgba(0, 0, 0, 0.04) 36px,
        rgba(0, 0, 0, 0.04) 72px
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)) 12px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #intro-overlay.intro-fading {
      opacity: 0;
      pointer-events: none;
    }

    /* Slide-out navigation drawer transitions */
    #drawer-backdrop {
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }
    #drawer-backdrop.drawer-closed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #mobile-drawer {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #mobile-drawer.drawer-closed {
      transform: translateX(-100%);
    }

    /* Subtle fixture card hover elevation */
    .fixture-card {
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .fixture-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 4px 14px -4px rgba(17, 24, 39, 0.06);
    }

    /* Smooth accordion expansion */
    @keyframes expandFade {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-expand {
      animation: expandFade 0.18s ease-out forwards;
    }

    /* Toast feedback pill */
    #toast-pill {
      transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="min-h-screen bg-[#F6F8FA] text-[#111827]">

  <!-- ===================================================================== -->
  <!-- 1. STARTUP PITCH ANIMATION (4.6s, NO SKIP, NO BOTTOM PROGRESS BAR)    -->
  <!--    Players: Chief (#10), Foers (#9), Hunter (GK), Calum (Sideline)    -->
  <!-- ===================================================================== -->
  <div id="intro-overlay" aria-label="Footy Checker Matchday Intro">
    <!-- Clean Centered Brand Pill Above SVG Pitch -->
    <div class="shrink-0 mb-3 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-black/35 border border-white/15 backdrop-blur-md shadow-md">
      <svg viewBox="0 0 48 48" class="w-5 h-5 shrink-0" fill="none" aria-hidden="true">
        <path d="M11 12H37L41 18V36H15L11 33V12Z" fill="#0F172A" fill-opacity="0.35" />
        <g stroke="#E2E8F0" stroke-opacity="0.55" stroke-width="1.2">
          <line x1="18" y1="12" x2="21" y2="36" />
          <line x1="25" y1="12" x2="28" y2="36" />
          <line x1="32" y1="12" x2="35" y2="36" />
          <line x1="12" y1="20" x2="40" y2="20" />
          <line x1="13" y1="28" x2="40" y2="28" />
        </g>
        <path d="M10 37V13C10 12.1 10.7 11.4 11.6 11.4H36.4C37.3 11.4 38 12.1 38 13V37" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M5 33L16 27" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" />
        <g transform="translate(24, 23)">
          <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
          <polygon points="0,-3.4 3.2,-1 2,2.8 -2,2.8 -3.2,-1" fill="#0F172A" />
        </g>
      </svg>
      <span class="text-[11px] sm:text-xs font-extrabold tracking-[0.15em] uppercase text-white whitespace-nowrap">
        FOOTY CHECKER
      </span>
    </div>

    <!-- Self-Contained Responsive Vertical Pitch SVG -->
    <div class="flex-1 min-h-0 w-full flex items-center justify-center">
      <svg
        id="intro-svg"
        viewBox="0 0 400 580"
        preserveAspectRatio="xMidYMid meet"
        style="width: 100%; max-width: 400px; max-height: 82vh; display: block;"
        class="select-none"
        role="img"
        aria-label="Animated football sequence showing Chief and Foers scoring past goalkeeper Hunter while Calum celebrates on the sideline"
      >
        <defs>
          <!-- Mowed stadium turf stripes -->
          <pattern id="pitch-stripes" width="284" height="60" patternUnits="userSpaceOnUse">
            <rect width="284" height="30" fill="#1b7c47" />
            <rect y="30" width="284" height="30" fill="#166c3d" />
          </pattern>

          <!-- Sleek Pro Kit Gradients -->
          <linearGradient id="kit-emerald" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="55%" stop-color="#059669" />
            <stop offset="100%" stop-color="#047857" />
          </linearGradient>
          <linearGradient id="kit-hunter" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FB923C" />
            <stop offset="55%" stop-color="#F97316" />
            <stop offset="100%" stop-color="#EA580C" />
          </linearGradient>
          <linearGradient id="bib-calum" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="100%" stop-color="#F59E0B" />
          </linearGradient>

          <!-- 3D Brushed Metallic Goalpost & Net Roof Depth -->
          <linearGradient id="post-metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#E2E8F0" />
            <stop offset="100%" stop-color="#94A3B8" />
          </linearGradient>
          <linearGradient id="goal-depth" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#041910" stop-opacity="0.74" />
            <stop offset="100%" stop-color="#0B3B24" stop-opacity="0.32" />
          </linearGradient>
          <radialGradient id="net-impact-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95" />
            <stop offset="55%" stop-color="#10B981" stop-opacity="0.48" />
            <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
          </radialGradient>

          <!-- 3D Modern Pro Match Ball Gradient -->
          <radialGradient id="ball-sphere" cx="34%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="68%" stop-color="#F1F5F9" />
            <stop offset="100%" stop-color="#94A3B8" />
          </radialGradient>

          <!-- Crisp Drop Shadows & Neon Glow -->
          <filter id="pill-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
          </filter>
          <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- Outer Pitch Surround -->
        <rect x="6" y="6" width="388" height="568" rx="22" fill="#0d4125" stroke="rgba(255,255,255,0.16)" stroke-width="1.6" />

        <!-- Playable Pitch Surface (x: 16..300, center x: 158, y: 96..556) -->
        <rect x="16" y="96" width="284" height="460" rx="4" fill="url(#pitch-stripes)" />

        <!-- Crisp White Pitch Markings -->
        <g fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.3">
          <rect x="16" y="96" width="284" height="460" />
          <!-- Penalty Box -->
          <rect x="52" y="96" width="212" height="126" />
          <!-- 6-Yard Box -->
          <rect x="99" y="96" width="118" height="46" />
          <!-- Penalty Arc -->
          <path d="M 108 222 A 56 56 0 0 0 208 222" />
          <!-- Halfway Line & Center Circle -->
          <line x1="16" y1="530" x2="300" y2="530" />
          <path d="M 108 530 A 50 50 0 0 1 208 530" />
          <!-- Top Corner Arcs -->
          <path d="M 16 107 A 11 11 0 0 0 27 96" />
          <path d="M 289 96 A 11 11 0 0 0 300 107" />
        </g>
        <!-- Penalty Spot -->
        <circle cx="158" cy="188" r="3.5" fill="#FFFFFF" />

        <!-- RIGHT SIDELINE DUGOUT BENCH (outside touchline, x: 308..388) -->
        <g id="dugout-group">
          <rect x="308" y="314" width="52" height="114" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" stroke-dasharray="4 3" />
          <rect x="364" y="318" width="26" height="106" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1.4" />
          <rect x="367" y="324" width="9" height="94" rx="2.5" fill="#334155" />
          <rect x="368.5" y="329" width="6" height="17" rx="2" fill="#1E293B" />
          <rect x="368.5" y="350" width="6" height="17" rx="2" fill="#1E293B" />
          <rect x="368.5" y="371" width="6" height="17" rx="2" fill="#1E293B" />
          <rect x="368.5" y="392" width="6" height="17" rx="2" fill="#1E293B" />
          <text x="383" y="371" fill="#94A3B8" font-size="6.8" font-weight="800" letter-spacing="1.1" text-anchor="middle" transform="rotate(90 383 371)">BENCH</text>
        </g>

        <!-- 3D METALLIC STADIUM GOAL & RIPPLING DIAMOND NET (centered x: 158, width: 140) -->
        <g id="goal-group">
          <polygon points="88,96 98,46 218,46 228,96" fill="url(#goal-depth)" />
          <path d="M 98 46 L 98 58 M 218 46 L 218 58 M 88 96 L 98 58 L 218 58 L 228 96" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
          <!-- Emerald Net Impact Glow -->
          <ellipse id="net-glow" cx="208" cy="63" rx="26" ry="18" fill="url(#net-impact-glow)" opacity="0" />
          <!-- Dynamic Rippling Diamond Stadium Net Mesh -->
          <g id="goal-net-lines" stroke="rgba(241,245,249,0.7)" stroke-width="1.15" fill="none"></g>
          <!-- Rear Top Frame Rail -->
          <path d="M 88 88 L 98 46 L 218 46 L 228 88" fill="none" stroke="#CBD5E1" stroke-width="2.2" stroke-linejoin="round" />
          <!-- 3D Brushed Metallic Crossbar & Goalposts -->
          <path d="M 88 96 L 88 87 L 228 87 L 228 96" fill="none" stroke="#0F172A" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 88 96 L 88 87 L 228 87 L 228 96" fill="none" stroke="url(#post-metal)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#pill-shadow)" />
          <line x1="91" y1="85.8" x2="225" y2="85.8" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.95" />
          <circle cx="88" cy="96" r="3.2" fill="#FFFFFF" stroke="#475569" stroke-width="1" />
          <circle cx="228" cy="96" r="3.2" fill="#FFFFFF" stroke="#475569" stroke-width="1" />
        </g>

        <!-- GOALKEEPER "HUNTER" CLEAR NAME BADGE (Above goal — zero overlap) -->
        <g id="hunter-label" transform="translate(158, 24)" filter="url(#pill-shadow)">
          <rect x="-40" y="-13.5" width="80" height="26" rx="13" fill="#0F172A" stroke="#FB923C" stroke-width="2.3" />
          <polygon points="-5,12.5 5,12.5 0,18" fill="#FB923C" />
          <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="900" letter-spacing="0.4">Hunter</text>
        </g>

        <!-- GOALKEEPER "HUNTER" SPRITE (Orange/Black Keeper Kit + White Gloves) -->
        <g id="hunter-sprite" transform="translate(158, 118)">
          <ellipse cx="0" cy="24" rx="20" ry="7" fill="rgba(0,0,0,0.34)" />
          <g id="hunter-body" transform="rotate(0)">
            <!-- Keeper Boots -->
            <ellipse cx="-8" cy="22" rx="5.5" ry="7" fill="#0F172A" stroke="#FB923C" stroke-width="1.1" />
            <ellipse cx="8" cy="22" rx="5.5" ry="7" fill="#0F172A" stroke="#FB923C" stroke-width="1.1" />
            <!-- Black Keeper Shorts with Orange Trim -->
            <rect x="-14.5" y="5" width="29" height="13.5" rx="4.5" fill="#0F172A" />
            <rect x="-14.5" y="6" width="3" height="10.5" rx="1.5" fill="#FB923C" />
            <rect x="11.5" y="6" width="3" height="10.5" rx="1.5" fill="#FB923C" />
            <!-- Outstretched Diving Arms -->
            <line id="hunter-arm-l" x1="-15" y1="-2" x2="-25" y2="8" stroke="#EA580C" stroke-width="7" stroke-linecap="round" />
            <line id="hunter-arm-r" x1="15" y1="-2" x2="25" y2="8" stroke="#EA580C" stroke-width="7" stroke-linecap="round" />
            <!-- White Padded Keeper Gloves -->
            <circle id="hunter-glove-l" cx="-26.5" cy="9.5" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6" />
            <circle id="hunter-glove-r" cx="26.5" cy="9.5" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6" />
            <!-- Gradient Orange Keeper Jersey #1 -->
            <rect x="-17" y="-14.5" width="34" height="23" rx="8" fill="url(#kit-hunter)" stroke="#7C2D12" stroke-width="1.5" />
            <path d="M -15.5 -8.5 Q -10.5 -14.5 -5 -14.5 L -9.5 -5 Z" fill="#0F172A" opacity="0.4" />
            <path d="M 15.5 -8.5 Q 10.5 -14.5 5 -14.5 L 9.5 -5 Z" fill="#0F172A" opacity="0.4" />
            <path d="M -5 -14.5 L 0 -10 L 5 -14.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
            <text x="0" y="2.5" text-anchor="middle" fill="#0F172A" font-size="13.5" font-weight="900">1</text>
            <!-- Head & Hair -->
            <circle cx="0" cy="-24" r="10.8" fill="#F4C7A6" stroke="rgba(15,23,42,0.4)" stroke-width="1.3" />
            <path d="M -10.4 -25 C -9.6 -35.5 9.6 -35.5 10.4 -25 Q 4.5 -28 0 -26.5 Q -4.5 -28 -10.4 -25 Z" fill="#451A03" />
          </g>
        </g>

        <!-- SIDELINE SUB "CALUM" CLEAR NAME BADGE -->
        <g id="calum-label" transform="translate(346, 298)" filter="url(#pill-shadow)">
          <rect x="-37" y="-13" width="74" height="25" rx="12.5" fill="#0F172A" stroke="#FACC15" stroke-width="2.3" />
          <polygon points="-4.5,12 4.5,12 0,17" fill="#FACC15" />
          <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="0.3">Calum</text>
        </g>

        <!-- CALUM CHEER POPUP ON GOAL -->
        <g id="calum-cheer" transform="translate(346, 264)" opacity="0" filter="url(#pill-shadow)">
          <g id="calum-cheer-inner" transform="scale(0)">
            <rect x="-25" y="-11" width="50" height="22" rx="11" fill="#10B981" stroke="#ECFDF5" stroke-width="1.5" />
            <text x="0" y="4" text-anchor="middle" fill="#052E16" font-size="11.5" font-weight="900">YES!</text>
          </g>
        </g>

        <!-- SIDELINE SUBSTITUTE "CALUM" SPRITE (Bright Yellow/Amber Bib) -->
        <g id="calum-sprite" transform="translate(334, 370)">
          <ellipse cx="0" cy="23" rx="18" ry="6.5" fill="rgba(0,0,0,0.32)" />
          <g id="calum-body" transform="translate(0, 0)">
            <ellipse cx="-7.5" cy="21" rx="5.2" ry="6.8" fill="#0F172A" stroke="#34D399" stroke-width="1.1" />
            <ellipse cx="7.5" cy="21" rx="5.2" ry="6.8" fill="#0F172A" stroke="#34D399" stroke-width="1.1" />
            <rect x="-13.5" y="5" width="27" height="13" rx="4" fill="#1E293B" />
            <rect x="-13.5" y="6" width="2.5" height="10" rx="1.2" fill="#34D399" />
            <rect x="11" y="6" width="2.5" height="10" rx="1.2" fill="#34D399" />
            <line id="calum-arm-l" x1="-14.5" y1="-2" x2="-22" y2="8" stroke="#1E293B" stroke-width="6.8" stroke-linecap="round" />
            <line id="calum-arm-r" x1="14.5" y1="-2" x2="22" y2="8" stroke="#1E293B" stroke-width="6.8" stroke-linecap="round" />
            <!-- High-Vis Yellow/Amber Bib -->
            <rect x="-16" y="-14" width="32" height="22" rx="8" fill="url(#bib-calum)" stroke="#B45309" stroke-width="1.5" />

            <path d="M -4.8 -14 L 0 -9.2 L 4.8 -14" fill="none" stroke="#1E293B" stroke-width="1.9" stroke-linecap="round" />
            <!-- Head & Hair -->
            <circle cx="0" cy="-23.5" r="10.4" fill="#F4C7A6" stroke="rgba(15,23,42,0.4)" stroke-width="1.3" />
            <path d="M -10 -24.5 C -9 -34.8 9 -34.8 10 -24.5 Q 3 -27.8 -3 -26 Z" fill="#78350F" />
          </g>
        </g>

        <!-- ATTACKER #10 "CHIEF" (Emerald/White Pro Kit) -->
        <g id="chief-sprite" transform="translate(88, 448)">
          <ellipse cx="0" cy="24" rx="19.5" ry="7" fill="rgba(0,0,0,0.34)" />
          <g id="chief-body" transform="translate(0, 0)">
            <ellipse id="chief-leg-l" cx="-8" cy="22" rx="5.4" ry="7" fill="#0F172A" stroke="#34D399" stroke-width="1.1" />
            <ellipse id="chief-leg-r" cx="8" cy="22" rx="5.4" ry="7" fill="#0F172A" stroke="#34D399" stroke-width="1.1" />
            <rect x="-14.5" y="5" width="29" height="13.5" rx="4.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" />
            <rect x="-14.5" y="6" width="3" height="10.5" rx="1.5" fill="#10B981" />
            <rect x="11.5" y="6" width="3" height="10.5" rx="1.5" fill="#10B981" />
            <line id="chief-arm-l" x1="-15" y1="-2" x2="-23.5" y2="8" stroke="#10B981" stroke-width="7" stroke-linecap="round" />
            <line id="chief-arm-r" x1="15" y1="-2" x2="23.5" y2="8" stroke="#10B981" stroke-width="7" stroke-linecap="round" />
            <!-- Pro Gradient Emerald Jersey #10 -->
            <rect x="-17" y="-14.5" width="34" height="23" rx="8" fill="url(#kit-emerald)" stroke="#FFFFFF" stroke-width="1.8" />
            <path d="M -5.8 -14.5 L 0 -9.2 L 5.8 -14.5" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
            <line x1="-14.5" y1="-7.5" x2="-9.5" y2="-13" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" />
            <line x1="14.5" y1="-7.5" x2="9.5" y2="-13" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" />
            <text x="0" y="3" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900">10</text>
            <!-- Head & Stylish Hair -->
            <circle cx="0" cy="-24" r="10.8" fill="#F4C7A6" stroke="rgba(15,23,42,0.4)" stroke-width="1.3" />
            <path d="M -10.4 -25.5 C -9.6 -36 9.6 -36 10.4 -25.5 L 5.5 -28 L 0 -26.5 L -5.5 -28 Z" fill="#0F172A" />
          </g>
        </g>

        <!-- "CHIEF" HIGH-CONTRAST NAME BADGE -->
        <g id="chief-label" transform="translate(88, 495)" filter="url(#pill-shadow)">
          <polygon points="-4.5,-13 4.5,-13 0,-18" fill="#34D399" />
          <rect x="-36" y="-13" width="72" height="25" rx="12.5" fill="#0F172A" stroke="#34D399" stroke-width="2.3" />
          <text x="0" y="4.5" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="0.4">Chief</text>
        </g>

        <!-- ATTACKER #9 "FOERS" (Emerald/White Pro Kit + White Headband) -->
        <g id="foers-sprite" transform="translate(226, 458)">
          <ellipse cx="0" cy="24" rx="19.5" ry="7" fill="rgba(0,0,0,0.34)" />

  <!-- ===================================================================== -->
  <!-- 5. SELF-CONTAINED APPLICATION LOGIC (BULLETPROOF IIFE)                -->
  <!-- ===================================================================== -->
  <script>
    (function () {
      'use strict';

      /* ===================================================================
         PART 1: BULLETPROOF SVG STARTUP PITCH ANIMATION (4600ms)
         - 0.0s–1.2s: Chief dribbles upfield, Foers sprints, Hunter shuffles, Calum bounces
         - 1.2s–2.1s: Chief plays crisp diagonal pass to Foers & bursts into box
         - 2.1s–2.9s: Foers slides return pass; Chief strikes curling rocket shot
         - 2.9s–3.5s: Ball rockets into top-right corner as Hunter dives full stretch & misses
         - 3.5s–4.6s: Net ripples & glows emerald, sparks & GOAL! pop, Chief/Foers/Calum celebrate
         - At 4.6s: Smooth 400ms fade out -> display: none
         =================================================================== */

      var INTRO_DURATION_MS = 4600;
      var introRafId = null;
      var introStartTs = null;
      var introActive = false;

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }
      function easeOutCubic(t) {
        var x = clamp(t, 0, 1);
        return 1 - Math.pow(1 - x, 3);
      }
      function easeInOutQuad(t) {
        var x = clamp(t, 0, 1);
        return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
      }
      function setAttr(el, name, val) {
        if (el) el.setAttribute(name, val);
      }

      // Build & animate rippling 3D diamond stadium net mesh
      function updateGoalNetMesh(netLinesGroup, impactSec) {
        if (!netLinesGroup) return;
        var cols = 12;
        var rows = 5;
        var gL = 88;
        var gR = 228;
        var gY = 96;
        var backY = 46;
        var hitX = 208;
        var hitY = 63;

        var rippling = impactSec > 0 && impactSec < 1.4;
        var decay = rippling ? Math.exp(-impactSec * 2.5) : 0;

        var grid = [];
        for (var ci = 0; ci <= cols; ci++) {
          grid[ci] = [];
          var fracC = ci / cols;
          for (var ri = 0; ri <= rows; ri++) {
            var fracR = ri / rows;
            var inset = fracR * 10;
            var x = lerp(gL + inset, gR - inset, fracC);
            var y = lerp(gY, backY, fracR);

            if (rippling && ri > 0) {
              var dx = x - hitX;
              var dy = y - hitY;
              var dist = Math.sqrt(dx * dx + dy * dy);
              var falloff = Math.exp(-dist / 52);
              var wave = Math.sin(impactSec * 34 - dist * 0.16) * 11 * decay * falloff;
              var push = -12 * decay * falloff * fracR;
              x += wave * 0.45;
              y += push + wave * 0.4;
            }
            grid[ci][ri] = x.toFixed(1) + ',' + y.toFixed(1);
          }
        }

        var paths = '';
        for (var c = 0; c < cols; c++) {
          for (var r = 0; r < rows; r++) {
            paths += '<path d="M' + grid[c][r] + 'L' + grid[c + 1][r + 1] + 'M' + grid[c + 1][r] + 'L' + grid[c][r + 1] + '" />';
          }
        }
        for (var hr = 1; hr < rows; hr++) {
          var d = '';
          for (var hc = 0; hc <= cols; hc++) {
            d += (hc === 0 ? 'M' : 'L') + grid[hc][hr];
          }
          paths += '<path d="' + d + '" stroke-opacity="0.45" />';
        }
        netLinesGroup.innerHTML = paths;
      }

      // Render one deterministic frame of the 4.6-second SVG pitch intro
      function renderIntroFrame(els, progress01) {
        var p = clamp(progress01, 0, 1);
        var t = p * 4.6; // seconds 0.0 -> 4.6
        var shotHitTime = 3.45;
        var impactSec = t - shotHitTime;

        var targetX = 208;
        var targetY = 63;

        var cx = 88, cy = 448, cBob = 0, cArmsUp = false, cStride = 0;
        var fx = 226, fy = 458, fBob = 0, fArmsUp = false, fStride = 0;
        var hx = 158, hy = 118, hRot = 0, hDiveStretch = 0;
        var bx = 100, by = 412, bRot = 0;
        var trailD = '', trailOpacity = 0;
        var calumJump = 0, calumArmsUp = false;

        if (t < 1.2) {
          // Phase 1 (0.0s–1.2s): Build-up & Dribble
          var u1 = easeInOutQuad(t / 1.2);
          cx = lerp(88, 102, u1);
          cy = lerp(448, 336, u1);
          cBob = Math.abs(Math.sin(t * 10)) * 3.5;
          cStride = t * 14;

          fx = lerp(226, 232, u1);
          fy = lerp(458, 304, u1);
          fBob = Math.abs(Math.sin(t * 10 + 1.4)) * 3.5;
          fStride = t * 14 + 1.5;

          bx = cx + 12 + Math.sin(t * 11) * 2.5;
          by = cy - 32;
          bRot = t * 440;

          // Hunter shuffles ready in goal
          hx = 158 + Math.sin(t * 5.2) * 14;
          hy = 118 + Math.sin(t * 9) * 1.4;

          // Calum bounces watching from the sideline
          calumJump = Math.abs(Math.sin(t * 4.5)) * 3.5;
        } else if (t < 2.1) {
          // Phase 2 (1.2s–2.1s): Crisp diagonal pass Chief -> Foers
          var u2 = easeInOutQuad((t - 1.2) / 0.9);
          var passU = easeOutCubic(clamp((t - 1.2) / 0.72, 0, 1));

          cx = lerp(102, 126, u2);
          cy = lerp(336, 250, u2);
          cBob = Math.abs(Math.sin(t * 11)) * 3.5;
          cStride = t * 15;

          fx = lerp(232, 226, u2);
          fy = lerp(304, 262, u2);
          fBob = Math.abs(Math.sin(t * 9)) * 2.5;
          fStride = t * 12;

          bx = lerp(114, 210, passU);
          by = lerp(304, 250, passU);
          bRot = t * 720;

          var prevPass = Math.max(0, passU - 0.32);
          trailD = 'M ' + lerp(114, 210, prevPass).toFixed(1) + ' ' + lerp(304, 250, prevPass).toFixed(1) +
                   ' L ' + bx.toFixed(1) + ' ' + by.toFixed(1);
          trailOpacity = 0.62;

          hx = lerp(158, 178, u2);
          hy = 118;
          calumJump = Math.abs(Math.sin(t * 5.5)) * 4;
        } else if (t < 2.9) {
          // Phase 3 (2.1s–2.9s): Return pass Foers -> Chief & strike setup
          var u3 = easeInOutQuad((t - 2.1) / 0.8);
          var retU = easeOutCubic(clamp((t - 2.1) / 0.65, 0, 1));

          cx = lerp(126, 138, u3);
          cy = lerp(250, 212, u3);
          cBob = Math.abs(Math.sin(t * 11)) * 3;
          cStride = t * 15;

          fx = lerp(226, 232, u3);
          fy = lerp(262, 234, u3);
          fStride = t * 10;

          bx = lerp(210, 146, retU);
          by = lerp(250, 192, retU);
          bRot = t * 780;

          var prevRet = Math.max(0, retU - 0.32);
          trailD = 'M ' + lerp(210, 146, prevRet).toFixed(1) + ' ' + lerp(250, 192, prevRet).toFixed(1) +
                   ' L ' + bx.toFixed(1) + ' ' + by.toFixed(1);
          trailOpacity = retU < 0.96 ? 0.62 : 0;

          hx = lerp(178, 154, u3);
          hy = 118;
          calumJump = Math.abs(Math.sin(t * 6)) * 4.5;
        } else if (t < shotHitTime) {
          // Phase 4 (2.9s–3.45s): Curling rocket shot + Hunter full-stretch dive (always beaten!)
          var shotU = clamp((t - 2.9) / (shotHitTime - 2.9), 0, 1);

          cx = lerp(138, 142, easeOutCubic(shotU));
          cy = lerp(212, 204, easeOutCubic(shotU));
          fx = lerp(232, 226, shotU);
          fy = lerp(234, 226, shotU);

          var curve = Math.sin(shotU * Math.PI) * 18;
          bx = lerp(146, targetX, shotU) + curve;
          by = lerp(192, targetY, shotU);
          bRot = t * 1450;

          var pU1 = Math.max(0, shotU - 0.42);
          var pU2 = Math.max(0, shotU - 0.21);
          var tx1 = lerp(146, targetX, pU1) + Math.sin(pU1 * Math.PI) * 18;
          var ty1 = lerp(192, targetY, pU1);
          var tx2 = lerp(146, targetX, pU2) + Math.sin(pU2 * Math.PI) * 18;
          var ty2 = lerp(192, targetY, pU2);
          trailD = 'M ' + tx1.toFixed(1) + ' ' + ty1.toFixed(1) +
                   ' Q ' + tx2.toFixed(1) + ' ' + ty2.toFixed(1) +
                   ' ' + bx.toFixed(1) + ' ' + by.toFixed(1);
          trailOpacity = 0.88;

          // Hunter launches horizontally across goalmouth with gloves stretched
          var diveU = easeOutCubic(clamp((t - 2.94) / 0.50, 0, 1));
          hx = lerp(154, 188, diveU);
          hy = 118 - Math.sin(diveU * Math.PI) * 10;
          hRot = lerp(0, 78, diveU);
          hDiveStretch = diveU;

          calumJump = 5;
        } else {
          // Phase 5 (3.45s–4.6s): Net ripple, emerald glow, sparks, GOAL! badge & celebrations
          var post = t - shotHitTime;
          var settleU = easeOutCubic(clamp(post / 0.42, 0, 1));

          bx = lerp(targetX, targetX - 7, settleU);
          by = lerp(targetY, targetY + 12, settleU);
          bRot = shotHitTime * 1450 + settleU * 140;

          // Hunter lands after full-stretch dive
          var landU = easeOutCubic(clamp(post / 0.35, 0, 1));
          hx = lerp(188, 194, landU);
          hy = lerp(118, 124, landU);
          hRot = lerp(78, 86, landU);
          hDiveStretch = 1;

          // Chief & Foers celebrate cleanly separated
          var celU = easeOutCubic(clamp(post / 0.75, 0, 1));
          cx = lerp(142, 112, celU);
          cy = lerp(204, 248, celU);
          cBob = Math.abs(Math.sin(post * 9)) * 14;
          cArmsUp = true;

          fx = lerp(226, 212, celU);
          fy = lerp(226, 248, celU);
          fBob = Math.abs(Math.sin(post * 9 + 0.8)) * 14;
          fArmsUp = true;

          // Calum leaps & cheers excitedly on the sideline!
          calumJump = Math.abs(Math.sin(post * 10)) * 16;
          calumArmsUp = true;
        }

        // 1. Update dynamic diamond net mesh
        updateGoalNetMesh(els.netLinesGroup, impactSec);

        // 2. Hunter (GK) — outer translate, inner rotate
        setAttr(els.hunterSprite, 'transform', 'translate(' + hx.toFixed(1) + ',' + hy.toFixed(1) + ')');
        setAttr(els.hunterBody, 'transform', 'rotate(' + hRot.toFixed(1) + ')');
        var hArmY = lerp(8, -27, hDiveStretch);
        var hArmX = lerp(25, 26, hDiveStretch);
        setAttr(els.hunterArmL, 'x2', (-hArmX).toFixed(1));
        setAttr(els.hunterArmL, 'y2', hArmY.toFixed(1));
        setAttr(els.hunterArmR, 'x2', hArmX.toFixed(1));
        setAttr(els.hunterArmR, 'y2', hArmY.toFixed(1));
        setAttr(els.hunterGloveL, 'cx', (-hArmX - 1.5).toFixed(1));
        setAttr(els.hunterGloveL, 'cy', (hArmY - (hDiveStretch > 0.3 ? 1.8 : -1.5)).toFixed(1));
        setAttr(els.hunterGloveR, 'cx', (hArmX + 1.5).toFixed(1));
        setAttr(els.hunterGloveR, 'cy', (hArmY - (hDiveStretch > 0.3 ? 1.8 : -1.5)).toFixed(1));
        setAttr(els.hunterLabel, 'transform', 'translate(' + clamp(hx, 124, 196).toFixed(1) + ',24)');

        // 3. Calum (Sideline)
        setAttr(els.calumBody, 'transform', 'translate(0,' + (-calumJump).toFixed(1) + ')');
        setAttr(els.calumLabel, 'transform', 'translate(346,' + (298 - calumJump * 0.6).toFixed(1) + ')');
        if (calumArmsUp) {
          var wave = Math.sin(impactSec * 18) * 4.5;
          setAttr(els.calumArmL, 'x2', '-23');
          setAttr(els.calumArmL, 'y2', (-25 + wave).toFixed(1));
          setAttr(els.calumArmR, 'x2', '23');
          setAttr(els.calumArmR, 'y2', (-25 - wave).toFixed(1));
          var cheerS = easeOutCubic(clamp((impactSec - 0.05) / 0.25, 0, 1));
          setAttr(els.calumCheer, 'transform', 'translate(346,' + (264 - calumJump * 0.45).toFixed(1) + ')');
          setAttr(els.calumCheerInner, 'transform', 'scale(' + cheerS.toFixed(2) + ')');
          setAttr(els.calumCheer, 'opacity', cheerS.toFixed(2));
        } else {
          setAttr(els.calumArmL, 'x2', '-22');
          setAttr(els.calumArmL, 'y2', '8');
          setAttr(els.calumArmR, 'x2', '22');
          setAttr(els.calumArmR, 'y2', '8');
          setAttr(els.calumCheer, 'opacity', '0');
        }

        // 4. Chief (#10)
        setAttr(els.chiefSprite, 'transform', 'translate(' + cx.toFixed(1) + ',' + cy.toFixed(1) + ')');
        setAttr(els.chiefBody, 'transform', 'translate(0,' + (-cBob).toFixed(1) + ')');
        setAttr(els.chiefLegL, 'cy', (22 + Math.sin(cStride) * 4.5).toFixed(1));
        setAttr(els.chiefLegR, 'cy', (22 - Math.sin(cStride) * 4.5).toFixed(1));
        setAttr(els.chiefArmL, 'y2', cArmsUp ? '-26' : '8');
        setAttr(els.chiefArmR, 'y2', cArmsUp ? '-26' : '8');
        setAttr(els.chiefLabel, 'transform', 'translate(' + clamp(cx, 54, 260).toFixed(1) + ',' + (cy + 47).toFixed(1) + ')');

        // 5. Foers (#9)
        setAttr(els.foersSprite, 'transform', 'translate(' + fx.toFixed(1) + ',' + fy.toFixed(1) + ')');
        setAttr(els.foersBody, 'transform', 'translate(0,' + (-fBob).toFixed(1) + ')');
        setAttr(els.foersLegL, 'cy', (22 + Math.sin(fStride) * 4.5).toFixed(1));
        setAttr(els.foersLegR, 'cy', (22 - Math.sin(fStride) * 4.5).toFixed(1));
        setAttr(els.foersArmL, 'y2', fArmsUp ? '-26' : '8');
        setAttr(els.foersArmR, 'y2', fArmsUp ? '-26' : '8');
        setAttr(els.foersLabel, 'transform', 'translate(' + clamp(fx, 54, 260).toFixed(1) + ',' + (fy + 47).toFixed(1) + ')');

        // 6. Pro Match Ball + Glowing Trail
        setAttr(els.ballSprite, 'transform', 'translate(' + bx.toFixed(1) + ',' + by.toFixed(1) + ')');
        setAttr(els.ballSpin, 'transform', 'rotate(' + (bRot % 360).toFixed(1) + ')');
        setAttr(els.ballTrail, 'd', trailD);
        setAttr(els.ballTrail, 'opacity', trailOpacity.toFixed(2));
        setAttr(els.ballTrailGlow, 'd', trailD);
        setAttr(els.ballTrailGlow, 'opacity', (trailOpacity * 0.65).toFixed(2));

        // 7. Impact Shockwave, Emerald Net Glow, Sparks & Bold GOAL! Badge
        if (impactSec > 0) {
          var ringU = clamp(impactSec / 0.52, 0, 1);
          setAttr(els.goalRing, 'r', (10 + ringU * 40).toFixed(1));
          setAttr(els.goalRing, 'opacity', ((1 - ringU) * 0.92).toFixed(2));

          var glowOp = Math.exp(-impactSec * 2.2);
          setAttr(els.netGlow, 'opacity', glowOp.toFixed(2));

          var sparkU = clamp(impactSec / 0.45, 0, 1);
          setAttr(els.goalSparksInner, 'transform', 'scale(' + (0.6 + sparkU * 1.15).toFixed(2) + ')');
          setAttr(els.goalSparks, 'opacity', ((1 - sparkU) * 0.95).toFixed(2));

          var flashIn = easeOutCubic(clamp(impactSec / 0.26, 0, 1));
          setAttr(els.goalFlashInner, 'transform', 'scale(' + lerp(0.7, 1.0, flashIn).toFixed(3) + ')');
          setAttr(els.goalFlash, 'opacity', flashIn.toFixed(2));
        } else {
          setAttr(els.goalRing, 'opacity', '0');
          setAttr(els.netGlow, 'opacity', '0');
          setAttr(els.goalSparks, 'opacity', '0');
          setAttr(els.goalFlash, 'opacity', '0');
        }
      }

      var introEls = null;

      function startIntro() {
        if (!introEls) introEls = getIntroElements();
        if (!introEls.overlay) return;

        if (introRafId !== null) {
          cancelAnimationFrame(introRafId);
          introRafId = null;
        }

        introStartTs = null;
        introActive = true;
        introEls.overlay.style.display = 'flex';
        introEls.overlay.classList.remove('intro-fading');
        void introEls.overlay.offsetWidth; // force reflow for clean replay

        renderIntroFrame(introEls, 0);

        function tick(ts) {
          if (!introActive) return;
          if (introStartTs === null) introStartTs = ts;
          var elapsed = ts - introStartTs;
          var progress = clamp(elapsed / INTRO_DURATION_MS, 0, 1);

          renderIntroFrame(introEls, progress);

          if (progress >= 1) {
            finishIntro();
          } else {
            introRafId = requestAnimationFrame(tick);
          }
        }

        introRafId = requestAnimationFrame(tick);
      }

      function finishIntro() {
        introActive = false;
        if (introRafId !== null) {
          cancelAnimationFrame(introRafId);
          introRafId = null;
        }
        if (!introEls || !introEls.overlay) return;
        introEls.overlay.classList.add('intro-fading');
        setTimeout(function () {
          if (!introActive && introEls && introEls.overlay) {
            introEls.overlay.style.display = 'none';
          }
        }, 420);
      }

            away: isHome ? opp : club,
          });
        }

        list.sort(function (a, b) {
          return (a.date + a.time).localeCompare(b.date + b.time);
        });
        return list.slice(0, 10);

        pill.classList.remove('translate-y-8', 'opacity-0');

          labelEl.textContent = 'My Picks';

              id: fx.id,

              competition: comp.name,
              stage: fx.stage,
              home: TEAMS[fx.home],

      function bindUIEvents() {
        var drawerEl = document.getElementById('mobile-drawer');
        var backdropEl = document.getElementById('drawer-backdrop');
        var openMenuBtn = document.getElementById('open-menu-btn');
        var closeMenuBtn = document.getElementById('close-menu-btn');
        var desktopSidebarEl = document.getElementById('desktop-sidebar');
        var appGridEl = document.getElementById('app-grid');

        function openDrawer() {
          if (!drawerEl || !backdropEl) return;
          drawerEl.classList.remove('drawer-closed');
          backdropEl.classList.remove('drawer-closed');
          if (openMenuBtn) openMenuBtn.setAttribute('aria-expanded', 'true');
          document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
          if (!drawerEl || !backdropEl) return;
          drawerEl.classList.add('drawer-closed');
          backdropEl.classList.add('drawer-closed');
          if (openMenuBtn) openMenuBtn.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = '';
        }

        if (openMenuBtn) {
          openMenuBtn.addEventListener('click', function () {
            if (window.innerWidth >= 1024 && desktopSidebarEl && appGridEl) {
              state.desktopSidebarCollapsed = !state.desktopSidebarCollapsed;
              if (state.desktopSidebarCollapsed) {
                desktopSidebarEl.classList.remove('lg:block');
                appGridEl.classList.remove('lg:grid', 'lg:grid-cols-[252px_minmax(0,1fr)]');
              } else {
                desktopSidebarEl.classList.add('lg:block');
                appGridEl.classList.add('lg:grid', 'lg:grid-cols-[252px_minmax(0,1fr)]');
              }
            } else {
              openDrawer();
            }
          });
        }

        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeDrawer);
        if (backdropEl) backdropEl.addEventListener('click', closeDrawer);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeDrawer();
        });

        // Club Search & Autocomplete
        var searchForm = document.getElementById('club-search-form');
        var searchInput = document.getElementById('club-search-input');
        var clearSearchBtn = document.getElementById('clear-search-btn');
        var suggestionsBox = document.getElementById('club-suggestions');

        function updateSuggestions(rawQuery) {
          if (!suggestionsBox || !clearSearchBtn) return;
          var q = rawQuery.trim().toLowerCase();
          if (!q) {
            suggestionsBox.classList.add('hidden');
            clearSearchBtn.classList.add('hidden');
            return;
          }
          clearSearchBtn.classList.remove('hidden');

          var hits = Object.keys(TEAMS)
            .map(function (k) { return TEAMS[k]; })
            .filter(function (t) {
              return !t.isNational && (
                t.name.toLowerCase().indexOf(q) !== -1 ||
                t.fullName.toLowerCase().indexOf(q) !== -1 ||
                t.short.toLowerCase().indexOf(q) !== -1
              );
            })
            .slice(0, 6);

          var html = hits.map(function (c) {
            return (
              '<button type="button" data-suggest-id="' + c.id + '" ' +
              'class="w-full px-3.5 py-2.5 flex items-center justify-between gap-2 hover:bg-[#F6F8FA] text-left border-b border-[#F1F5F9] last:border-b-0 cursor-pointer">' +
                '<div class="flex items-center gap-2.5 min-w-0">' +
                  crestSVG(c) +
                  '<div class="min-w-0">' +
                    '<div class="text-sm font-bold text-[#111827] truncate">' + c.fullName + '</div>' +
                    '<div class="text-[11px] text-[#6B7280] truncate">' + c.league + '</div>' +
                  '</div>' +
                '</div>' +
                '<span class="text-xs font-semibold text-[#059669] shrink-0">Next 10</span>' +
              '</button>'
            );
          }).join('');

          var hasExact = hits.some(function (c) {
            return c.name.toLowerCase() === q || c.fullName.toLowerCase() === q;
          });
          if (!hasExact) {
            var safe = rawQuery.trim().replace(/[<>&"]/g, '');
            html +=
              '<button type="button" data-suggest-custom="' + safe + '" ' +
              'class="w-full px-3.5 py-3 flex items-center justify-between gap-2 bg-[#ECFDF5] hover:bg-[#D1FAE5]/70 text-left cursor-pointer">' +
                '<span class="text-xs sm:text-sm font-bold text-[#059669] truncate">Next 10 games for &ldquo;' + safe + '&rdquo;</span>' +
                '<span class="text-xs font-extrabold text-[#059669] shrink-0">&rarr;</span>' +
              '</button>';
          }

          suggestionsBox.innerHTML = html;
          suggestionsBox.classList.remove('hidden');
        }

        if (searchInput) {
          searchInput.addEventListener('input', function (e) {
            updateSuggestions(e.target.value);
          });
        }

        if (clearSearchBtn && searchInput && suggestionsBox) {
          clearSearchBtn.addEventListener('click', function () {
            searchInput.value = '';
            suggestionsBox.classList.add('hidden');
            clearSearchBtn.classList.add('hidden');
            searchInput.focus();
          });
        }

        if (searchForm && searchInput && suggestionsBox) {
          searchForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var q = searchInput.value.trim();
            if (!q) return;
            state.activeClub = resolveClub(q);
            suggestionsBox.classList.add('hidden');
            renderApp();
            showToast('Loaded ' + state.activeClub.fullName);
          });

          document.addEventListener('click', function (e) {
            if (!searchForm.contains(e.target)) {
              suggestionsBox.classList.add('hidden');
            }
          });
        }

        // Delegated Click Handlers
        document.body.addEventListener('click', function (e) {
          var navBtn = e.target.closest('[data-nav-route]');
          if (navBtn) {
            var route = navBtn.getAttribute('data-nav-route');
            closeDrawer();
            if (route === 'action:replay') {
              startIntro();
              return;
            }
            state.activeRoute = route;
            state.confirmResetPicks = false;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          var sugId = e.target.closest('[data-suggest-id]');
          if (sugId) {
            var cid = sugId.getAttribute('data-suggest-id');
            if (TEAMS[cid]) {
              state.activeClub = TEAMS[cid];
              if (searchInput) searchInput.value = TEAMS[cid].fullName;
              if (suggestionsBox) suggestionsBox.classList.add('hidden');
              renderApp();
            }
            return;
          }

          var sugCustom = e.target.closest('[data-suggest-custom]');
          if (sugCustom) {
            var name = sugCustom.getAttribute('data-suggest-custom');
            state.activeClub = resolveClub(name);
            if (searchInput) searchInput.value = state.activeClub.fullName;
            if (suggestionsBox) suggestionsBox.classList.add('hidden');
            renderApp();
            showToast('Loaded ' + state.activeClub.fullName);
            return;
          }

          var chip = e.target.closest('[data-quick-club]');
          if (chip) {
            var qid = chip.getAttribute('data-quick-club');
            if (TEAMS[qid]) {
              state.activeClub = TEAMS[qid];
              if (searchInput) searchInput.value = '';
              if (clearSearchBtn) clearSearchBtn.classList.add('hidden');
              renderApp();
            }
            return;
          }

          var pickBtn = e.target.closest('[data-pick-choice]');
          if (pickBtn) {
            var fid = pickBtn.getAttribute('data-fixture-id');
            var choice = pickBtn.getAttribute('data-pick-choice');
            var homeName = pickBtn.getAttribute('data-home');
            var awayName = pickBtn.getAttribute('data-away');
            var date = pickBtn.getAttribute('data-date');
            var competition = pickBtn.getAttribute('data-comp');

            if (state.picks[fid] && state.picks[fid].choice === choice) {
              delete state.picks[fid];
              showToast('Pick removed');
            } else {
              var label = choice === 'H' ? homeName + ' Win' : choice === 'D' ? 'Draw' : awayName + ' Win';
              state.picks[fid] = { choice: choice, label: label, homeName: homeName, awayName: awayName, date: date, competition: competition };
              showToast('Saved: ' + label);
            }
            savePicks();
            renderApp();
            return;
          }

          var cardToggle = e.target.closest('[data-toggle-card]');
          if (cardToggle) {
            var tid = cardToggle.getAttribute('data-toggle-card');
            if (state.expandedIds[tid]) delete state.expandedIds[tid];
            else state.expandedIds[tid] = true;
            renderApp();
            return;
          }

          var delPick = e.target.closest('[data-delete-pick]');
          if (delPick) {
            var did = delPick.getAttribute('data-delete-pick');
            delete state.picks[did];
            savePicks();
            renderApp();
            showToast('Pick removed');
            return;
          }

          if (e.target.closest('#trigger-reset-picks')) {
            state.confirmResetPicks = true;
            renderApp();
            return;
          }
          if (e.target.closest('#confirm-reset-no')) {
            state.confirmResetPicks = false;
            renderApp();
            return;
          }
          if (e.target.closest('#confirm-reset-yes')) {
            state.picks = {};
            state.confirmResetPicks = false;
            savePicks();
            renderApp();
            showToast('All picks cleared');
          }
        });
      }

      /* ===================================================================
         PART 7: IMMEDIATE / DOMCONTENTLOADED BOOTSTRAP
         =================================================================== */

      function initApp() {
        loadPicks();
        bindUIEvents();
        renderApp();
        startIntro();
      }

      if (document.readyState !== 'loading') {
        initApp();
      } else {
        document.addEventListener('DOMContentLoaded', initApp);
      }
    })();
  </script>
</body>
</html>
